name: Devices - Start and restore

on:
  schedule:
    - cron: '50 05 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

env:
  TERM: xterm

jobs:
  corellium-start:
    name: Start and snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Pull the latest code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: 24
      - name: Install Corellium CLI
        run: |
          npm ci --no-audit --no-fund
          echo "$(pwd)/node_modules/.bin" >> "${GITHUB_PATH}"
      - name: Log in to Corellium
        run: |
          corellium login \
            --apitoken ${{ secrets.CORELLIUM_API_TOKEN }} \
            --endpoint ${{ secrets.CORELLIUM_API_ENDPOINT }}
      - name: Start Corellium virtual devices
        env:
          START_INSTANCES: ${{ vars.START_INSTANCES }}
        run: |
          source ./src/functions.sh && set -euo pipefail
          start_demo_instances
      - name: Restore snapshots
        env:
          CORELLIUM_API_ENDPOINT: ${{ secrets.CORELLIUM_API_ENDPOINT }}
          CORELLIUM_API_TOKEN: ${{ secrets.CORELLIUM_API_TOKEN }}
          RESTORE_SNAPSHOTS: ${{ vars.RESTORE_SNAPSHOTS }}
        run: |
          source ./src/functions.sh && set -euo pipefail
          set -x
          restore_demo_instance_snapshots
